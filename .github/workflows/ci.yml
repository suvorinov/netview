name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Линтер (ruff)
        run: ruff check app/ tests/

      - name: Тесты (pytest)
        run: pytest tests/ -q
