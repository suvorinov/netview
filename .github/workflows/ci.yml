name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Линтер (ruff)
        run: ruff check app/ tests/

      - name: Тесты (pytest)
        run: pytest tests/ -q

      - name: Проверка CSS (пересборка должна быть закоммичена)
        run: |
          curl -sL https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64 -o tailwindcss
          chmod +x tailwindcss
          ./tailwindcss -c tailwind.config.js -i app/static/css/tailwind.input.css -o /tmp/app-check.css --minify
          if ! diff -q /tmp/app-check.css app/static/css/app.css >/dev/null; then
            echo "::error::app/static/css/app.css устарел: шаблоны менялись без 'make css'"
            exit 1
          fi
