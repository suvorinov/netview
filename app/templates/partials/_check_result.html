<!-- Результат проверки принтеров -->
<div class="p-3 rounded-lg {% if 'Ошибка' in message %}bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200{% else %}bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200{% endif %}">
    <div class="flex items-center gap-2">
        <i class="fas {% if 'Ошибка' in message %}fa-exclamation-circle{% else %}fa-check-circle{% endif %}"></i>
        {{ message }}
    </div>
</div>
