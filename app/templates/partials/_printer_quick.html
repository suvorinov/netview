<!-- Критический тонер на Dashboard -->
{% if critical_printers %}
<div class="space-y-3">
    {% for printer in critical_printers %}
    <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700 rounded-lg">
        <div class="flex items-center gap-3">
            <i class="fas fa-print text-gray-400"></i>
            <div>
                <p class="font-medium">{{ printer.name }}</p>
                <p class="text-sm text-gray-500 dark:text-gray-400">{{ printer.ip }} | {{ printer.model }}</p>
            </div>
        </div>
        <span class="px-2 py-1 text-xs rounded-full bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200">
            {{ printer.toner_percentage }}
        </span>
    </div>
    {% endfor %}
</div>
{% else %}
<p class="text-gray-500 dark:text-gray-400 text-center py-4">
    <i class="fas fa-check-circle text-green-500 mr-1"></i>Критический тонер не обнаружен
</p>
{% endif %}
{% if printers %}
<a href="/printers/" class="block text-center text-blue-500 hover:underline mt-3">
    Показать все ({{ printer_count }})
</a>
{% endif %}
