<div class="px-4 py-3 rounded-lg {% if success %}bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200{% else %}bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200{% endif %} flex items-center gap-2">
    <i class="fas fa-{% if success %}check-circle{% else %}exclamation-circle{% endif %}"></i>
    <span>{{ message }}</span>
</div>
