<!-- Статистика хостов -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4 text-center">
        <p class="text-3xl font-bold text-purple-600 dark:text-purple-400">{{ stats.total }}</p>
        <p class="text-sm text-gray-500 dark:text-gray-400">Всего</p>
    </div>
    <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4 text-center">
        <p class="text-3xl font-bold text-green-600 dark:text-green-400">{{ stats.online }}</p>
        <p class="text-sm text-gray-500 dark:text-gray-400">Онлайн</p>
    </div>
    <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4 text-center">
        <p class="text-3xl font-bold text-red-600 dark:text-red-400">{{ stats.offline }}</p>
        <p class="text-sm text-gray-500 dark:text-gray-400">Оффлайн</p>
    </div>
    <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4 text-center">
        <p class="text-3xl font-bold text-blue-600 dark:text-blue-400">{{ "%.1f"|format(stats.avg_cpu|default(0)) }}%</p>
        <p class="text-sm text-gray-500 dark:text-gray-400">Ср. CPU</p>
    </div>
</div>
