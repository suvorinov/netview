<div class="overflow-x-auto">
    <table class="w-full">
        <thead class="bg-gray-50 dark:bg-gray-700">
            <tr>
                <th class="px-4 py-3 text-left text-sm font-medium">ID</th>
                <th class="px-4 py-3 text-left text-sm font-medium">Тип</th>
                <th class="px-4 py-3 text-left text-sm font-medium">Устройство</th>
                <th class="px-4 py-3 text-left text-sm font-medium">Сообщение</th>
                <th class="px-4 py-3 text-left text-sm font-medium">Дата</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
            {% for alert in alerts %}
            <tr class="hover:bg-gray-50 dark:hover:bg-gray-700">
                <td class="px-4 py-3 text-sm font-mono">{{ alert.id }}</td>
                <td class="px-4 py-3">
                    <span class="px-2 py-0.5 rounded-full text-xs font-medium
                        {% if alert.alert_type == 'new_device' %}bg-blue-100 text-blue-800 dark:bg-blue-900
                        {% elif alert.alert_type == 'unauthorized' %}bg-red-100 text-yellow-800 dark:bg-red-900 dark:text-yellow-200
                        {% else %}bg-gray-100 text-gray-600 dark:bg-gray-600{% endif %}">
                        {{ alert.alert_type }}
                    </span>
                </td>
                <td class="px-4 py-3 text-sm">{{ alert.device_mac or '—' }}</td>
                <td class="px-4 py-3 text-sm max-w-xs truncate">{{ alert.message }}</td>
                <td class="px-4 py-3 text-sm text-gray-500">{{ alert.created_at|datetime }}</td>
            </tr>
            {% endfor %}
            {% if not alerts %}
            <tr>
                <td colspan="5" class="px-4 py-8 text-center text-gray-500 dark:text-gray-400">
                    <i class="fas fa-bell-slash text-2xl mb-2 block"></i>
                    Оповещений нет
                </td>
            </tr>
            {% endif %}
        </tbody>
    </table>
</div>
