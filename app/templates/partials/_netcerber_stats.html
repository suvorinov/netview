<div class="grid grid-cols-2 md:grid-cols-4 gap-4 p-4">
    <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4 text-center">
        <p class="text-3xl font-bold text-blue-600 dark:text-blue-400">{{ total_devices }}</p>
        <p class="text-sm text-gray-500 dark:text-gray-400">Всего устройств</p>
    </div>
    <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4 text-center">
        <p class="text-3xl font-bold text-red-600 dark:text-red-400">{{ unauthorized }}</p>
        <p class="text-sm text-gray-500 dark:text-gray-400">Неавторизовано</p>
    </div>
    <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4 text-center">
        <p class="text-3xl font-bold text-green-600 dark:text-green-400">{{ total_devices - unauthorized }}</p>
        <p class="text-sm text-gray-500 dark:text-gray-400">Авторизовано</p>
    </div>
    <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4 text-center">
        <p class="text-3xl font-bold text-purple-600 dark:text-purple-400">
            {% if stats and stats.get('total_alerts') is not none %}
                {{ stats.total_alerts }}
            {% else %}
                {{ unauthorized }}
            {% endif %}
        </p>
        <p class="text-sm text-gray-500 dark:text-gray-400">Оповещений</p>
    </div>
</div>
