<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — NetView</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/all.min.css') }}">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm mx-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8">
            <div class="text-center mb-6">
                <div class="text-3xl font-bold flex items-center justify-center gap-2 mb-2">
                    <i class="fas fa-network-wired text-blue-500"></i>
                    NetView
                </div>
                <p class="text-sm text-gray-500 dark:text-gray-400">Вход в панель мониторинга</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="mb-4 space-y-2">
                {% for category, message in messages %}
                <div class="px-3 py-2 rounded-lg text-sm
                    {% if category == 'error' %}bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300
                    {% else %}bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div>
                    <label for="username" class="block text-sm font-medium mb-1">Имя пользователя</label>
                    <input type="text" id="username" name="username" required autofocus
                           class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium mb-1">Пароль</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>
                <button type="submit"
                        class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition text-sm font-medium">
                    <i class="fas fa-sign-in-alt mr-1"></i> Войти
                </button>
            </form>
        </div>
    </div>
</body>
</html>
