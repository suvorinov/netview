<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}NetView{% endblock %}</title>

    <!-- Применить сохранённую тему до отрисовки страницы (иначе мигание) -->
    <script>
        try {
            if (localStorage.getItem('netview-theme') === 'light') {
                document.documentElement.classList.remove('dark');
            }
        } catch (e) { /* приватный режим — остаётся тёмная по умолчанию */ }
    </script>

    <!-- Скомпилированный Tailwind (make css). Play CDN-сборка убрана:
         минус ~400 KB JS и компиляция CSS в браузере на каждый чих -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">

    <!-- HTMX -->
    <script src="{{ url_for('static', filename='vendor/htmx.min.js') }}"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/all.min.css') }}">

    <style>
        /* Стили для переключения темы */
        .sidebar-link:hover { background-color: #334155; }
        .sidebar-link.active { background-color: #3b82f6; }
        /* HTMX indicator */
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
        /* Во время HTMX-запроса кнопки гаснут и не дают двойной клик */
        button:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>

    <script>
        // Подставлять CSRF-токен во все HTMX-запросы (POST/PUT/DELETE).
        // Слушаем на document: скрипт в <head> выполняется до появления <body>.
        document.addEventListener('htmx:configRequest', (e) => {
            e.detail.headers['X-CSRFToken'] = document.querySelector('meta[name="csrf-token"]').content;
        });
        // Показывать фрагменты ошибок (4xx/5xx) вместо молчаливого отбрасывания
        document.addEventListener('htmx:beforeSwap', (e) => {
            if (e.detail.isError) {
                e.detail.shouldSwap = true;
            }
        });
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
    <div class="flex min-h-screen">

        <!-- SideBar -->
        <aside class="w-64 bg-sidebar text-white flex-shrink-0">
            <div class="p-4">
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fas fa-network-wired"></i>
                    NetView
                </h1>
            </div>
            <nav class="mt-2">
                <a href="/" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg mx-2 {% if request.endpoint == 'dashboard.index' %}active{% endif %}">
                    <i class="fas fa-tachometer-alt w-5"></i>
                    Dashboard
                </a>
                <a href="/printers/" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg mx-2 {% if 'printer' in request.endpoint|default('') %}active{% endif %}">
                    <i class="fas fa-print w-5"></i>
                    Принтеры
                </a>
                <a href="/hosts/" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg mx-2 {% if 'host' in request.endpoint|default('') %}active{% endif %}">
                    <i class="fas fa-server w-5"></i>
                    Хосты
                </a>
                <div class="border-t border-gray-600 my-2 mx-4"></div>
                <a href="/users/" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg mx-2 {% if 'user' in request.endpoint|default('') %}active{% endif %}">
                    <i class="fas fa-users w-5"></i>
                    Пользователи
                </a>
                <a href="/logs/" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg mx-2 {% if 'log' in request.endpoint|default('') %}active{% endif %}">
                    <i class="fas fa-file-alt w-5"></i>
                    Логи Squid
                </a>
                <a href="/stoplist/" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg mx-2 {% if 'stoplist' in request.endpoint|default('') %}active{% endif %}">
                    <i class="fas fa-ban w-5"></i>
                    Стоп-лист
                </a>
                <a href="/netcerber/" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg mx-2 {% if 'netcerber' in request.endpoint|default('') %}active{% endif %}">
                    <i class="fas fa-shield-alt w-5"></i>
                    NetCerber
                </a>
                <div class="border-t border-gray-600 my-2 mx-4"></div>
                <a href="/settings/" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg mx-2 {% if 'setting' in request.endpoint|default('') %}active{% endif %}">
                    <i class="fas fa-cog w-5"></i>
                    Настройки
                </a>
            </nav>
        </aside>

        <!-- Основной контент -->
        <main class="flex-1 p-6">
            <!-- Верхняя панель -->
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">{% block page_title %}Dashboard{% endblock %}</h2>
                <div class="flex items-center gap-3">
                    <span class="text-sm text-gray-500 dark:text-gray-400">
                        <i class="fas fa-user mr-1"></i>{{ current_user.id }}
                    </span>
                    <!-- Выход только POST+CSRF: GET-ссылку можно было
                         дёрнуть чужой картинкой (logout CSRF) -->
                    <form method="post" action="{{ url_for('auth.logout') }}"
                          class="inline">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" title="Выйти"
                                class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </form>
                    <button onclick="toggleTheme()" title="Светлая/тёмная тема"
                            class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700">
                        <i class="fas fa-moon dark:hidden"></i>
                        <i class="fas fa-sun hidden dark:inline"></i>
                    </button>
                </div>
            </div>

            <!-- Контент страницы -->
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Кнопка «наверх»: видна после прокрутки страницы вниз -->
    <button id="scroll-top" title="Наверх"
            onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
            class="hidden fixed bottom-6 right-6 z-50 p-3 rounded-full bg-blue-600 text-white shadow-lg hover:bg-blue-700">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Кастомный диалог подтверждения: заменяет системный confirm()
         для всех hx-confirm через перехват события htmx:confirm -->
    <div id="app-confirm" class="hidden fixed inset-0 z-[70] flex items-center justify-center bg-black/60 p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-w-md w-full p-6">
            <div class="flex items-start gap-3 mb-4">
                <i id="app-confirm-icon" class="fas fa-circle-question text-blue-500 text-xl mt-0.5"></i>
                <h3 class="text-lg font-semibold">Подтверждение</h3>
            </div>
            <p id="app-confirm-text" class="text-sm text-gray-600 dark:text-gray-300 whitespace-pre-line mb-6 ml-8"></p>
            <div class="flex gap-2 justify-end">
                <button type="button" onclick="appConfirm.hide()"
                        class="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 text-sm">
                    Отмена
                </button>
                <button type="button" id="app-confirm-ok"
                        class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm">
                    <i class="fas fa-check mr-1"></i>Продолжить
                </button>
            </div>
        </div>
    </div>

    <!-- Контейнер тостов (замена системного alert) -->
    <div id="app-toasts" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[80] space-y-2 w-full max-w-md px-4"></div>

    <script>
        const scrollTopBtn = document.getElementById('scroll-top');
        window.addEventListener('scroll', () => {
            scrollTopBtn.classList.toggle('hidden', window.scrollY < 300);
        }, {passive: true});

        // Переключить тему и запомнить выбор между страницами и сессиями
        function toggleTheme() {
            const root = document.documentElement;
            root.classList.toggle('dark');
            try {
                localStorage.setItem(
                    'netview-theme',
                    root.classList.contains('dark') ? 'dark' : 'light'
                );
            } catch (e) { /* приватный режим */ }
        }

        // ── Кастомные диалоги (замена alert/confirm) ────────────────
        window.appConfirm = {
            _onOk: null,
            show(text, onOk, danger = true) {
                this._onOk = onOk;
                document.getElementById('app-confirm-text').textContent = text;
                const ok = document.getElementById('app-confirm-ok');
                // Разрушительное действие — красная кнопка, остальное — синяя
                ok.className = 'px-4 py-2 text-white rounded-lg text-sm ' +
                    (danger ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700');
                document.getElementById('app-confirm').classList.remove('hidden');
            },
            hide() {
                this._onOk = null;
                document.getElementById('app-confirm').classList.add('hidden');
            },
            accept() {
                const cb = this._onOk;
                this.hide();
                if (cb) cb();
            }
        };
        document.getElementById('app-confirm-ok')
            .addEventListener('click', () => appConfirm.accept());
        // Esc и клик по фону закрывают диалог
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') appConfirm.hide();
        });
        document.getElementById('app-confirm').addEventListener('click', (e) => {
            if (e.target.id === 'app-confirm') appConfirm.hide();
        });

        // Все hx-confirm в приложении идут через кастомный диалог:
        // preventDefault отменяет нативный confirm, issueRequest(true)
        // выполняет запрос от имени HTMX.
        document.addEventListener('htmx:confirm', (e) => {
            const question = e.detail.question;
            if (!question) return;
            e.preventDefault();
            appConfirm.show(question, () => e.detail.issueRequest(true));
        });

        // Тост вместо alert(): auto-hide через 4с, ошибки — дольше
        window.appNotify = function(message, isError = false) {
            const box = document.createElement('div');
            box.className = 'flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-sm ' +
                (isError
                    ? 'bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200'
                    : 'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200');
            box.innerHTML = '<i class="fas fa-' + (isError ? 'exclamation' : 'check') + '-circle"></i>';
            box.appendChild(document.createTextNode(message));
            const container = document.getElementById('app-toasts');
            container.appendChild(box);
            setTimeout(() => box.remove(), isError ? 7000 : 4000);
        };
    </script>
</body>
</html>
