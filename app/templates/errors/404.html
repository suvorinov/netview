{% extends "base.html" %}

{% block title %}NetView - 404{% endblock %}
{% block page_title %}Не найдено{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-16">
    <i class="fas fa-exclamation-triangle text-yellow-500 text-6xl mb-4"></i>
    <h3 class="text-xl font-bold mb-2">{{ message|default('Страница не найдена') }}</h3>
    <p class="text-gray-500 mb-6">Запрашиваемый ресурс не существует или был перемещён.</p>
    <a href="/" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
        <i class="fas fa-home mr-1"></i> На главную
    </a>
</div>
{% endblock %}
